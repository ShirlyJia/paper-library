<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="结构化数据论文库：表格基础模型、结构化决策、因果分析与相关方法的共享论文索引。提供中文概览、发表与会议标记、原文与 PDF 入口。">
    <meta property="og:title" content="结构化数据论文库">
    <meta property="og:description" content="表格基础模型、结构化决策与相关方法的论文索引。">
    <meta property="og:type" content="website">
    <meta name="color-scheme" content="light">
    <title>结构化数据论文库</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=10">
    <link rel="stylesheet" href="./hierarchy.css?v=10">
    <script type="module" src="./app.js?v=10"></script>
  </head>
  <body>
    <a class="skip-link" href="#catalogue">跳至论文列表</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="结构化数据论文库首页">
        <img src="./assets/mark.svg" width="34" height="34" alt="">
        <span>结构化数据论文库<span class="brand-note">SHARED RESEARCH LIBRARY</span></span>
      </a>
      <nav class="header-nav" aria-label="站点导航">
        <button class="saved-button" id="saved-toggle" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          本机收藏 <span id="saved-count">0</span>
        </button>
      </nav>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="研究方向">
        <div class="shelf-label"><span>研究目录</span><button id="collapse-tree" type="button">收起全部</button></div>
        <button id="mobile-directory" type="button" aria-expanded="false" aria-controls="categories"><span>浏览完整研究目录</span><span aria-hidden="true">＋</span></button>
        <nav id="categories" class="category-list" aria-label="按研究方向筛选"></nav>
        <div class="sidebar-bottom">
          <div class="shelf-drawing" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p>收录记录</p>
          <span id="last-updated">更新于 —</span>
        </div>
      </aside>

      <main id="catalogue" tabindex="-1">
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
        <section class="intro">
          <div>
            <p class="eyebrow" id="view-level">RESEARCH LIBRARY</p>
            <h1 id="view-title" tabindex="-1">结构化数据模型<br><span>研究论文清单</span></h1>
            <p class="intro-description" id="view-description">按研究领域、子方向和具体议题整理相关论文。</p>
          </div>
          <div class="collection-counter" aria-label="当前目录收录数量"><span id="total-count">—</span><span id="count-label">篇论文 / PAPERS</span></div>
        </section>
        <div class="scope-questions" id="scope-questions" hidden></div>

        <details class="activity-board" id="activity-board" hidden>
          <summary><span class="activity-title">近期更新</span><span id="activity-summary"></span><span class="activity-toggle" aria-hidden="true"></span></summary>
          <div class="activity-body">
            <p class="activity-note" id="activity-note"></p>
            <div id="activity-days"></div>
          </div>
        </details>

        <section class="controls" aria-label="搜索与筛选">
          <div class="search-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <label class="sr-only" for="search">搜索论文、模型或关键词</label>
            <input id="search" type="search" placeholder="搜索论文、模型或关键词" autocomplete="off" spellcheck="false">
            <kbd aria-hidden="true">/</kbd>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <label class="sr-only" for="period">时间范围</label>
              <select id="period"><option value="all">全部时间</option><option value="6m">近 6 个月</option></select>
              <label class="sr-only" for="status">发表状态</label>
              <select id="status"><option value="all">全部发表状态</option><option value="published">会议 / 期刊</option><option value="workshop">Workshop</option><option value="preprint">预印本</option><option value="report">技术报告</option></select>
              <label class="check-filter"><input type="checkbox" id="code-only"><span>有代码</span></label>
            </div>
            <div class="sort-group">
              <label class="sr-only" for="sort">排列顺序</label>
              <select id="sort" title="默认按论文首发排序，也可按本站收录日期排列"><option value="relevance">相关度优先</option><option value="newest">最新公开在前</option><option value="oldest">最早公开在前</option><option value="added">最近收录在前</option><option value="updated">最近修订在前</option><option value="title">标题 A–Z</option></select>
              <button class="export-button" id="export-csv" title="导出当前筛选结果为 CSV">导出索引 <span aria-hidden="true">↓</span></button>
            </div>
          </div>
        </section>

        <section class="directory-panel" id="directory-panel" aria-labelledby="directory-title">
          <div class="section-heading"><h2 id="directory-title">研究领域</h2><span id="directory-count"></span></div>
          <div id="directory-cards" class="directory-cards"></div>
        </section>
        <div class="section-heading paper-section-heading"><h2 id="paper-section-title">全部论文</h2><span id="paper-scope-label"></span></div>
        <div class="results-heading">
          <p id="result-count" role="status" aria-live="polite">正在加载论文…</p>
          <button id="reset" hidden>清除筛选 <span aria-hidden="true">×</span></button>
        </div>
        <section id="papers" class="paper-grid" aria-label="论文列表" aria-busy="true"></section>
        <div id="empty-state" class="empty-state" hidden>
          <span class="empty-index" aria-hidden="true">[ 0 ]</span>
          <h2>暂时没有匹配的论文</h2>
          <p id="empty-description">换一个关键词，或放宽筛选条件。</p>
          <button id="empty-reset" class="button-primary">查看全部论文</button>
        </div>
        <nav id="pagination" class="pagination" aria-label="论文分页"></nav>
        <noscript><p>请启用 JavaScript 以浏览和筛选论文，或<a href="./data/papers.json">下载完整索引</a>。</p></noscript>
        <footer class="site-footer"><span>SHARED RESEARCH LIBRARY</span><a href="./data/papers.json" download="paper-library.json">JSON 索引 ↓</a></footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
